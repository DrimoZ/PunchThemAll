plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    // pta-1.21.1-2.1.0.jar — the Minecraft version belongs in the file name, since the same mod
    // version can ship for several of them.
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Its own directory, not the shared dev world. The tests then start from nothing every
            // time — no world to grow and save, and none of the hand-installed datapacks in run/ to
            // load — which is most of the difference between a slow run and a quick one.
            gameDirectory = file('run/gametest')
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases"
    }
}

dependencies {
    // JEI (NeoForge). API at compile time, full jar at runtime.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // EMI (NeoForge). API only at compile time; add the runtimeOnly line below to test EMI in-dev.
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    // Uncomment to test the EMI plugin in dev. The full jar currently fails to download from
    // TerraformersMC (the transfer truncates; the api and sources jars are fine), so it has to be
    // dropped into run/mods by hand for now.
    // runtimeOnly "dev.emi:emi-neoforge:${emi_version}"

    // Unit tests. Most exercise pure logic, but anything touching ItemStack/NBT needs the vanilla
    // registries, so the suite boots Minecraft's Bootstrap once (see McBootstrap).
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    // The launcher is compiled against, not just run with: McBootstrapSessionListener hooks session
    // start so Minecraft boots before JUnit loads any test class.
    testImplementation "org.junit.platform:junit-platform-launcher"
    // Mockito for the handful of tests that need a Level or Player: those interfaces reach deep into
    // the game and building a real one costs more than it proves.
    testImplementation "org.mockito:mockito-core:5.14.2"
}

// Give the test source set the Minecraft/NeoForge classes (NBT, codecs, ...).
neoForge.addModdingDependenciesTo(sourceSets.test)

// A jar that travels without its licence leaves the person who found it in a modpack with no
// way to know what they may do with it.
tasks.named("jar", Jar).configure {
    from(rootProject.file("LICENSE")) { into("META-INF") }
    from(rootProject.file("LICENSE-ASSETS")) { into("META-INF") }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging { events "passed", "failed", "skipped" }

    // ExamplePackTest parses the shipped example pack, so editing an example has to invalidate the
    // task. Without this Gradle only watches the sources, and a broken example ships as up-to-date.
    inputs.dir(layout.projectDirectory.dir("examples")).withPathSensitivity(PathSensitivity.RELATIVE)
}

// The game tests need the structure template that the unit suite generates, and they are the slower
// of the two — so unit tests run first and a failure there costs nothing extra.
tasks.named('runGameTestServer').configure {
    mustRunAfter tasks.named('test')
}

tasks.register('verify') {
    group = 'verification'
    description = 'Runs the unit suite and then the in-world game tests.'
    dependsOn tasks.named('test'), tasks.named('runGameTestServer')
}

// Expand ${...} placeholders in neoforge.mods.toml and pack.mcmeta from gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the generated metadata in the main resources and in IDE/run resources.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
