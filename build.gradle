plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    // pta-26.1.2-2.2.0.jar — the Minecraft version belongs in the file name, since the same mod
    // version can ship for several of them.
    archivesName = "${mod_id}-${minecraft_version}"
}

// Mojang ships Java 25 to end users in 26.1, so that is what mods target.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neo_version

    // No parchment block: Minecraft is deobfuscated from 26.1 onwards.

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Run the unit tests through FML rather than bootstrapping the game by hand. Since 26.1
    // SharedConstants.<clinit> asks FMLEnvironment whether it is in production, which needs a current
    // FMLLoader — there is no longer a way to reach a usable Minecraft from a bare JVM.
    unitTest {
        enable()
        testedMod = mods.getByName(project.mod_id)
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    // The TerraformersMC repo (EMI) is gone with the EMI plugin; restore both together.
}

dependencies {
    // JEI (NeoForge). API at compile time, full jar at runtime.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // No EMI: its newest NeoForge artifact is 1.1.24+1.21.1, so there is nothing to compile the
    // emi/ plugin against on 26.1. See gradle.properties and the porting plan §4.

    // Unit tests. Most exercise pure logic, but anything touching ItemStack/NBT needs the vanilla
    // registries, so the suite runs under FML (neoForge.unitTest above) and calls Bootstrap itself
    // once (see McBootstrap).
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Mockito for the handful of tests that need a Level or Player: those interfaces reach deep into
    // the game and building a real one costs more than it proves. 5.20 is the floor for Java 25 —
    // older byte-buddy cannot instrument Level once FML's transformer has been through it.
    testImplementation "org.mockito:mockito-core:5.20.0"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging { events "passed", "failed", "skipped" }
}

// Expand ${...} placeholders in neoforge.mods.toml and pack.mcmeta from gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the generated metadata in the main resources and in IDE/run resources.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.register('verify') {
    group = 'verification'
    description = 'Runs the unit suite and then the in-world game tests.'
    dependsOn tasks.named('test'), tasks.named('runGameTestServer')
}

// A jar that travels without its licence leaves the person who found it in a modpack with no way to
// know what they may do with it.
tasks.named("jar", Jar).configure {
    from(rootProject.file("LICENSE")) { into("META-INF") }

    // The in-world tests build their world from a structure template, which has to live in the mod
    // resources for the dev server to find it. It is scaffolding, not content, and a released jar
    // has no business carrying a structure a player could place with a command.
    exclude("data/pta/structure/**")
}
