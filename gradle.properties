## Dependencies

# JEI for NeoForge 26.1 (29.x line). See https://www.curseforge.com/minecraft/mc-mods/jei
jei_version=29.20.0.60

# EMI has no 26.1 build. The newest NeoForge artifact on its maven is 1.1.24+1.21.1, so there is no
# API to compile against and the emi/ plugin cannot ship on this branch — see
# docs/porting/neoforge-26.1-plan.md §4. Re-check before each release; restore emi_version here when
# a 26.1 build appears.
