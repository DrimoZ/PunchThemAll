# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true


## Environment Properties (NeoForge 26.1)

minecraft_version=26.1.2
# Pinned exactly, per the 26.1 MDK. Minecraft's new versioning makes 26.1.1 and 26.1.2 separate
# targets rather than compatible patches, and PTA already ships one jar per Minecraft version.
minecraft_version_range=[26.1.2]
# NeoForge version — see https://projects.neoforged.net/neoforged/neoforge
# Four components now: the first three are the Minecraft version, the last is the NeoForge build.
neo_version=26.1.2.92
neo_version_range=[26.1,)

# No Parchment. Minecraft is shipped deobfuscated from 26.1 onwards, so parameter names come from
# Mojang directly and the mappings layer is gone.


